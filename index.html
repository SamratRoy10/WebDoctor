<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WebDoctor — Repository Investigation</title>
<style>
:root{--bg:#090b0f;--panel:#11151b;--panel2:#171d25;--line:#27303a;--text:#f1f4f7;--muted:#87919d;--blue:#3b82f6;--teal:#14b8a6;--amber:#f59e0b;--red:#ef4444;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0%,#182538 0,transparent 34%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 15px;background:rgba(11,14,19,.82)}.brand{font-weight:800;letter-spacing:.18em;font-size:14px;margin:3px 11px 34px}.brand i{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;border:1px solid #496681;border-radius:50%;color:var(--blue);font-style:normal;box-shadow:0 0 22px #2563eb66}.eyebrow,.label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}nav button{display:block;width:100%;padding:12px 11px;margin:4px 0;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}nav button.active,nav button:hover{background:var(--panel2);color:var(--text)}nav b{display:inline-block;width:25px;color:var(--blue)}.sidefoot{position:fixed;bottom:20px;width:205px;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.userdot{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#253a54;color:#a9d0ff;font-size:11px;font-weight:700;margin-right:8px}.userrow{display:flex;align-items:center}.logout{width:100%;margin-top:12px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;text-align:left}.logout:hover{background:var(--panel2);color:var(--text)}.repo-controls{display:flex;gap:10px;align-items:center;margin:0 0 16px}.repo-controls select{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px}.repo-controls .button{white-space:nowrap}.main{padding:28px 42px 50px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}.top h1{font-size:32px;margin:8px 0 9px;letter-spacing:-.04em}.top p{margin:0;color:var(--muted);max-width:670px;line-height:1.6}.status{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:9px 13px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.grid{display:grid;gap:16px}.hero{grid-template-columns:1.4fr .8fr;margin-bottom:16px}.card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,rgba(23,29,37,.98),rgba(14,18,24,.98));padding:22px}.repo-card{position:relative;overflow:hidden;min-height:252px}.repo-card:after{content:'';position:absolute;right:-90px;top:-100px;width:280px;height:280px;border:1px solid #2d78d533;border-radius:50%;box-shadow:0 0 0 25px #2d78d50d,0 0 0 50px #2d78d508}.repo-card h2{font-size:25px;margin:14px 0 10px;max-width:500px}.repo-card p{color:var(--muted);line-height:1.6;max-width:520px}.button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 15px;border-radius:8px;font-weight:650;cursor:pointer}.button.primary{background:var(--text);color:#090b0f;border-color:var(--text)}.button:hover{filter:brightness(1.14)}.button:disabled{opacity:.55;cursor:wait}.core{display:grid;place-items:center;min-height:252px;text-align:center}.orb{width:112px;height:112px;border-radius:50%;border:1px solid #4a88ba;background:radial-gradient(circle,#294b6d 0,#142431 40%,transparent 70%);box-shadow:0 0 0 14px #214b7024,0 0 55px #2375bd55;display:grid;place-items:center;color:#b9ddff;font-size:27px;margin:8px auto 15px}.core strong{display:block;letter-spacing:.12em;font-size:11px}.core small{display:block;color:var(--muted);margin-top:6px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.sectionhead h2{font-size:17px;margin:0}.sectionhead span{color:var(--muted);font-size:12px}.repos{grid-template-columns:repeat(3,1fr)}.repo{cursor:pointer;min-height:154px;transition:.2s;position:relative}.repo:hover{border-color:#3b82f688;transform:translateY(-2px)}.repo.selected{border-color:var(--blue);box-shadow:0 0 0 1px #3b82f655}.repo h3{margin:14px 0 7px;font-size:16px}.repo p{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 18px}.repo .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.repo .lock{color:var(--amber)}.state{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.state.public{color:var(--teal)}.empty{text-align:center;color:var(--muted);padding:45px 20px}.investigation{grid-template-columns:1.1fr .9fr}.selected-repo{display:flex;justify-content:space-between;align-items:center;padding-bottom:17px;border-bottom:1px solid var(--line)}.selected-repo h2{margin:5px 0;font-size:22px}.selected-repo p{color:var(--muted);margin:0}.scanline{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted)}.pulse{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 7px #3b82f622;animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 0 13px transparent}}.timeline{border-left:1px solid #35556d;padding-left:20px;margin:22px 0}.step{position:relative;margin:0 0 19px;color:var(--muted)}.step:before{content:'';position:absolute;left:-25px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}.step.done{color:var(--text)}.step.done:before{background:var(--green);border-color:var(--green)}.step.active{color:#9bcaff}.step.active:before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 5px #3b82f622}.result{min-height:260px}.result h3{margin:0 0 10px}.result pre{white-space:pre-wrap;word-break:break-word;color:#c4d0dd;font:12px/1.65 ui-monospace,SFMono-Regular,monospace;background:#0a0d12;border:1px solid var(--line);border-radius:9px;padding:16px;max-height:430px;overflow:auto}.risk{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.risk:last-child{border-bottom:0}.sev{font-size:10px;text-transform:uppercase;letter-spacing:.1em}.critical{color:var(--red)}.high{color:var(--amber)}.info{color:var(--blue)}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;background:var(--panel2);border:1px solid var(--line);padding:12px 14px;border-radius:9px;color:var(--muted);box-shadow:0 12px 40px #0008}@media(max-width:900px){.app{display:block}.side{position:static;border-right:0;border-bottom:1px solid var(--line);padding:14px}.brand{margin-bottom:14px}.sidefoot{display:none}nav{display:flex;overflow:auto;gap:5px}nav button{white-space:nowrap}.main{padding:24px 17px}.hero,.investigation{grid-template-columns:1fr}.repos{grid-template-columns:1fr 1fr}}@media(max-width:560px){.repos{grid-template-columns:1fr}.top{display:block}.status{margin-top:17px;width:max-content}.top h1{font-size:28px}}
</style></head>
<body><div id="root"></div><script>
const $=s=>document.querySelector(s);let state={session:localStorage.getItem('wd_session'),user:null,repos:[],selected:null,investigating:false,result:null,view:'repos',githubConnected:false};
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json'};if(state.session)opts.headers['x-webdoctor-session']=state.session;const r=await fetch(path,opts),d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Request failed');return d}
function login(){const name=prompt('Demo workspace name','Security Explorer')||'Security Explorer';api('/api/auth/demo-login',{method:'POST',body:JSON.stringify({name})}).then(d=>{state.session=d.sessionId;state.user=d.user;localStorage.setItem('wd_session',state.session);render()}).catch(alert)}
async function boot(){if(state.session)try{state.user=(await api('/api/auth/me')).user}catch(e){state.session=null;localStorage.removeItem('wd_session')}if(!state.user){render();return}await refreshIntegration();render();if(state.githubConnected)loadRepos()}
function shell(content){return `<div class="app"><aside class="side"><div class="brand"><i>◉</i>WEB<span>DOCTOR</span></div><nav><button class="${state.view==='repos'?'active':''}" onclick="setView('repos')"><b>◈</b>Repositories</button><button class="${state.view==='investigation'?'active':''}" onclick="setView('investigation')"><b>⌁</b>Investigation</button></nav><div class="sidefoot"><div class="eyebrow">Connected workspace</div><div class="userrow" style="margin-top:11px"><span class="userdot">${state.user?.avatar||'SE'}</span><span>${state.user?.name||'Demo user'}</span></div><button class="logout" onclick="logout()">↪ Log out</button></div></aside><main class="main">${content}</main></div>`}
function render(){if(!state.user){$('#root').innerHTML=`<div style="max-width:680px;margin:18vh auto;padding:24px;text-align:center"><div class="eyebrow">AI security command center</div><h1 style="font-size:54px;letter-spacing:-.06em;margin:18px 0 12px">Your repositories.<br>Under investigation.</h1><p style="color:var(--muted);line-height:1.7">Connect GitHub, select a repository, and let WebDoctor investigate the application surface without a chat layer in the way.</p><button class="button primary" onclick="login()" style="margin-top:20px">Enter demo workspace</button></div>`;return}let body=state.view==='investigation'?investigationView():reposView();$('#root').innerHTML=shell(body)}
function reposView(){return `<div class="top"><div><div class="eyebrow">Repository workspace</div><h1>Choose an application to investigate.</h1><p>WebDoctor loads your GitHub repositories first. Select one to start a pre-configured full-stack security investigation.</p></div><div class="status"><span class="dot"></span>${state.githubConnected?'GitHub connected':'GitHub not connected'}</div></div><div class="grid hero"><div class="card repo-card"><div class="eyebrow">Step 01 · scope the investigation</div><h2>Find the codebase behind the risk.</h2><p>WebDoctor will map application and infrastructure surfaces, correlate evidence, and return an assessment for the repository you select.</p><button class="button ${state.repos.length?'primary':''}" onclick="${state.githubConnected?'loadRepos()':'connectGithub()'}">${state.githubConnected?'Refresh repositories':'Connect GitHub'}</button></div><div class="card core"><div><div class="orb">◉</div><strong>WEBDOCTOR CORE</strong><small>Ready to investigate</small></div></div></div><div class="sectionhead"><h2>Your repositories</h2><span>${state.repos.length?state.repos.length+' available':'Waiting for GitHub authorization'}</span></div>${state.repos.length?`<div class="repo-controls"><select id="repoPicker" onchange="selectRepoFromPicker(this.value)"><option value="">Choose a repository to scan…</option>${state.repos.map(r=>`<option value="${esc(r.fullName)}" ${state.selected?.fullName===r.fullName?'selected':''}>${esc(r.fullName)}</option>`).join('')}</select><button class="button primary" onclick="scanPickedRepo()" ${state.selected?'':'disabled'}>Scan selected</button></div>`:''}<div class="grid repos">${state.repos.length?state.repos.map(repoCard).join(''):`<div class="card empty" style="grid-column:1/-1"><div style="font-size:28px;margin-bottom:12px">⌁</div><div>Connect GitHub to load your repositories.</div><button class="button" onclick="connectGithub()" style="margin-top:18px">Authorize GitHub</button></div>`}</div>`}
function repoCard(r){const selected=state.selected?.fullName===r.fullName;return `<div class="card repo ${selected?'selected':''}" onclick="selectRepo('${esc(r.fullName)}')"><span class="state ${r.private?'':'public'}">${r.private?'Private':'Public'}</span><h3>${esc(r.name||r.fullName)}</h3><p>${esc(r.description||'No repository description available.')}</p><div class="meta"><span>${esc(r.language||'Codebase')} · ${r.updatedAt?'Updated '+esc(r.updatedAt):'Ready'}</span><button class="button ${selected?'primary':''}" onclick="event.stopPropagation();selectRepo('${esc(r.fullName)}')">${selected?'Scan selected':'Choose & scan'}</button></div></div>`}
function investigationView(){let r=state.selected;return `<div class="top"><div><div class="eyebrow">Repository investigation</div><h1>${r?esc(r.name):'Select a repository'}</h1><p>${r?'A live assessment generated from preloaded WebDoctor investigation instructions.':'Return to repositories and choose a codebase to begin.'}</p></div><div class="status"><span class="dot" style="background:${state.investigating?'var(--blue)':'var(--green)'}"></span>${state.investigating?'Investigation running':'Assessment workspace'}</div></div>${r?`<div class="grid investigation"><div class="card"><div class="selected-repo"><div><div class="eyebrow">Target repository</div><h2>${esc(r.fullName)}</h2><p>GitHub source · user-scoped access</p></div><button class="button primary" onclick="runInvestigation()" ${state.investigating?'disabled':''}>${state.investigating?'Investigating…':'Run investigation'}</button></div><div class="scanline"><span class="pulse"></span><strong>${state.investigating?'WebDoctor is investigating this repository':'Ready for a deep scan'}</strong></div><div class="timeline"><div class="step ${state.investigating||state.result?'done':''}">Repository access verified</div><div class="step ${state.investigating||state.result?'done':''}">Application surface mapped</div><div class="step ${state.investigating?'active':state.result?'done':''}">Application agent analyzing auth, APIs, and data paths</div><div class="step ${state.investigating?'active':state.result?'done':''}">Infrastructure agent checking dependencies and deployment signals</div><div class="step ${state.result?'done':''}">Findings correlated into attack paths</div><div class="step">Remediation recommendations generated</div></div>${state.result?`<div class="result"><h3>WebDoctor output</h3><pre>${esc(state.result.text||JSON.stringify(state.result.raw,null,2))}</pre></div>`:''}</div><div class="card"><div class="eyebrow">Investigation brief</div><h2 style="margin:12px 0">What WebDoctor will inspect</h2><div class="risk"><div><strong>Application & API</strong><br><small style="color:var(--muted)">Auth, authorization, input, business logic</small></div><span class="sev info">Agent 01</span></div><div class="risk"><div><strong>System & infrastructure</strong><br><small style="color:var(--muted)">Docker, secrets, dependencies, CI/CD</small></div><span class="sev info">Agent 02</span></div><div class="risk"><div><strong>Attack-path correlation</strong><br><small style="color:var(--muted)">Evidence, confidence, impact, fixes</small></div><span class="sev high">Orchestrator</span></div>${state.result?`<div style="margin-top:24px;padding:15px;border:1px solid #245c4b;border-radius:9px;background:#10251f;color:#9de1c9">Assessment returned. Review the generated output on the left.</div>`:''}</div></div>`:`<div class="card empty">Choose a repository first.</div>`}`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setView(v){state.view=v;render()}function selectRepo(name){state.selected=state.repos.find(r=>r.fullName===name);state.result=null;state.view='investigation';render();runInvestigation()}function selectRepoFromPicker(name){if(name){state.selected=state.repos.find(r=>r.fullName===name);state.result=null;render()}}function scanPickedRepo(){if(state.selected){state.view='investigation';render();runInvestigation()}}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch(e){}localStorage.removeItem('wd_session');state={session:null,user:null,repos:[],selected:null,investigating:false,result:null,view:'repos',githubConnected:false};render()}
async function refreshIntegration(){try{const d=await api('/api/integrations');const list=d.integrations||d.data||d;const item=Array.isArray(list)?list.find(x=>(x.toolkit||x.name)==='github'):list.github||list;state.githubConnected=!!(item&&(item.connected===true||item.status==='connected'||item.state==='connected'||item.connectionStatus==='connected'||item.connectedAccountId));}catch(e){state.githubConnected=false}}
async function connectGithub(){try{await refreshIntegration();if(state.githubConnected){await loadRepos();return}const d=await api('/api/integrations',{method:'POST',body:JSON.stringify({toolkit:'github',redirectUri:location.origin+'/?connected=github'})});if(d.redirectUrl)location.href=d.redirectUrl;else{await refreshIntegration();await loadRepos()}}catch(e){if(String(e.message).includes('already connected')){state.githubConnected=true;render();await loadRepos();return}alert(e.message)}}
async function loadRepos(){try{const d=await api('/api/repositories',{method:'POST'});state.repos=d.repositories||[];render();if(!state.repos.length&&d.text)toast('GitHub connected, but the agent returned no structured repositories.');}catch(e){toast(e.message)}}
async function runInvestigation(){if(!state.selected||state.investigating)return;state.investigating=true;state.result=null;render();try{state.result=await api('/api/investigations',{method:'POST',body:JSON.stringify({repository:state.selected})})}catch(e){state.result={text:'Investigation failed: '+e.message}}state.investigating=false;render()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}
boot();if(new URLSearchParams(location.search).get('connected')){history.replaceState({},'',location.pathname);setTimeout(async()=>{await refreshIntegration();state.githubConnected=true;render();await loadRepos()},400)}
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebDoctor — AI Security Engineer</title><style>
:root{--bg:#0a0b0d;--panel:#121417;--panel2:#181b20;--line:#292d34;--muted:#858b96;--text:#f2f4f7;--blue:#3b82f6;--teal:#14b8a6;--amber:#f59e0b;--red:#ef4444;--green:#22c55e;--purple:#a855f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% -10%,#18202c 0,transparent 38%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 16px;background:#0d0f12}.brand{font-weight:800;letter-spacing:.16em;font-size:13px;margin:4px 10px 35px}.brand span{color:var(--blue)}.user{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:25px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#26344b;color:#9dc1ff;font-size:11px;font-weight:800}.user small,.muted{color:var(--muted)}nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);padding:11px 12px;border-radius:8px;margin:3px 0}nav button.active,nav button:hover{background:var(--panel2);color:var(--text)}nav button b{font-size:11px;margin-right:10px;color:var(--blue)}.main{max-width:1200px;width:100%;margin:auto;padding:28px 38px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}h1{font-size:38px;line-height:1.04;margin:10px 0}h2{font-size:19px;margin:0 0 5px}.sub{color:var(--muted);max-width:650px;line-height:1.6}.primary{background:var(--text);color:#0a0b0d;padding:12px 17px;border-radius:8px;font-weight:700}.primary:hover{background:#cdd5df}.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:11px 14px;border-radius:8px}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,1fr);margin:27px 0}.card{background:linear-gradient(145deg,var(--panel),#101215);border:1px solid var(--line);border-radius:14px;padding:19px}.metric strong{display:block;font-size:32px;margin:15px 0 5px}.metric .label{color:var(--muted);font-size:12px}.layout{grid-template-columns:1.35fr .85fr}.map{height:350px;position:relative;overflow:hidden}.map:before{content:'';position:absolute;inset:30px;background:linear-gradient(90deg,transparent 49.8%,#29333d 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,#29333d 50%,transparent 50.2%);opacity:.45}.node{position:absolute;padding:14px 20px;border:1px solid #3b4755;border-radius:10px;background:#151a20;text-align:center;box-shadow:0 0 24px #3b82f622}.node small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.n1{left:38%;top:12%}.n2{left:40%;top:42%;border-color:var(--blue)}.n3{left:13%;top:73%}.n4{left:42%;top:73%;border-color:var(--red)}.n5{right:12%;top:73%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:10px;padding:4px 7px;border-radius:99px;background:#26303b;color:#abc7ed}.danger{color:#ff7777}.success{color:#70e29b}.chat{height:calc(100vh - 160px);min-height:540px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;margin:16px 0}.bubble{max-width:78%;padding:13px 15px;border-radius:12px;line-height:1.55;white-space:pre-wrap}.bot{background:var(--panel2);border:1px solid var(--line);align-self:flex-start}.me{background:#1a355d;align-self:flex-end}.composer{display:flex;gap:8px}.composer input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px;color:var(--text)}.repo{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.repo:last-child{border:0}.hidden{display:none}.scan{border-left:2px solid var(--blue);padding-left:16px;margin:18px 0}.step{padding:10px 0;color:var(--muted)}.step.done{color:var(--green)}.step.active{color:var(--text)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:22px 16px}.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}h1{font-size:30px}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s);let state={session:localStorage.getItem('wd_session'),user:null,view:'overview'};const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json','x-webdoctor-session':state.session||''};const r=await fetch(path,opt);const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'Request failed');return d};
function login(){const name=prompt('Demo user name','Alex Morgan')||'Security Explorer';api('/api/auth/demo-login',{method:'POST',body:JSON.stringify({name})}).then(d=>{state.session=d.sessionId;state.user=d.user;localStorage.setItem('wd_session',state.session);render()})}
async function boot(){if(state.session)try{state.user=(await api('/api/auth/me')).user}catch{state.session=null;localStorage.removeItem('wd_session')}render()}
function shell(){return `<div class="app"><aside class="side"><div class="brand">WEB<span>DOCTOR</span></div><div class="user"><div class="avatar">${state.user.avatar}</div><div><b>${state.user.name}</b><br><small>Demo workspace</small></div></div><nav>${[['overview','◉','Overview'],['chat','✦','Security chat'],['repos','⌘','Repositories'],['report','▣','Security report']].map(x=>`<button class="${state.view==x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav><button class="ghost" style="width:100%;margin-top:25px" onclick="logout()">Sign out</button></aside><main class="main" id="main"></main></div>`}
function go(v){state.view=v;render()}function render(){if(!state.user){$('#root').innerHTML='<div style="max-width:620px;margin:18vh auto;padding:25px;text-align:center"><div class="eyebrow">AI security command center</div><h1>Your application.<br>Under investigation.</h1><p class="sub" style="margin:18px auto 28px">Connect GitHub, import a repository, and ask WebDoctor to find, prove, fix, and verify security risks.</p><button class="primary" onclick="login()">Enter demo workspace</button></div>';return}$('#root').innerHTML=shell();({overview:overview,chat:chat,repos:repos,report:report}[state.view])()}
function overview(){ $('#main').innerHTML=`<div class="top"><div><div class="eyebrow">Security command center</div><h1>Good afternoon, ${state.user.name.split(' ')[0]}.</h1><p class="sub">WebDoctor correlates application, infrastructure, and repository signals into actionable attack paths.</p></div><button class="primary" onclick="go('chat')">Start investigation</button></div><div class="grid metrics"><div class="card metric"><div class="label">THREATS</div><strong class="danger">04</strong><span class="muted">2 critical · 2 high</span></div><div class="card metric"><div class="label">ATTACK PATHS</div><strong style="color:var(--amber)">02</strong><span class="muted">Needs investigation</span></div><div class="card metric"><div class="label">COMPONENTS</div><strong style="color:var(--blue)">37</strong><span class="muted">Across 1 repository</span></div><div class="card metric"><div class="label">SECURITY SCORE</div><strong class="success">86</strong><span class="muted">+8 this week</span></div></div><div class="grid layout"><div class="card map"><div class="row"><div><h2>Application health</h2><span class="muted">Digital anatomy of your selected repository</span></div><span class="pill">LIVE MAP</span></div><div class="node n1">Internet<small>public surface</small></div><div class="node n2">API Gateway<small>12 endpoints · monitored</small></div><div class="node n3">Auth Service<small>1 warning</small></div><div class="node n4">Database<small>2 critical paths</small></div><div class="node n5">Worker Queue<small>healthy</small></div></div><div class="card"><div class="eyebrow">Latest incident</div><h2 style="margin-top:10px">Broken authorization</h2><p class="sub">WebDoctor discovered a potential path from an unauthenticated API request to protected user data.</p><div class="row"><span class="pill" style="color:#ff8d8d">CRITICAL · 94% CONFIDENCE</span><button class="ghost" onclick="go('report')">Investigate</button></div></div></div>`}
function chat(){ $('#main').innerHTML=`<div class="top"><div><div class="eyebrow">WebDoctor agent</div><h1>Security chat</h1><p class="sub">Ask WebDoctor to connect GitHub, import repositories, or investigate a selected codebase.</p></div><button class="ghost" onclick="connectGithub()">Connect GitHub</button></div><div class="card chat"><div id="messages" class="messages"><div class="bubble bot">I’m WebDoctor. Connect your GitHub account, then tell me which repository you want to investigate. I’ll map the stack before looking for vulnerabilities.</div></div><div class="composer"><input id="prompt" placeholder="Try: list my repositories, or scan owner/repo" onkeydown="if(event.key==='Enter')sendChat()"><button class="primary" onclick="sendChat()">Send</button></div></div>`}
async function connectGithub(){try{const d=await api('/api/integrations',{method:'POST',body:JSON.stringify({toolkit:'github',redirectUri:location.origin+'/?connected=github'})});if(d.redirectUrl)location.href=d.redirectUrl;else alert('Kopai did not return a redirect URL. Check the agent GitHub toolkit configuration.')}catch(e){alert(e.message)}}
async function sendChat(){const input=$('#prompt'),text=input.value.trim();if(!text)return;add(text,'me');input.value='';add('WebDoctor is investigating…','bot');try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:text})});$('.messages .bot:last-child').textContent=d.text}catch(e){$('.messages .bot:last-child').textContent='I could not complete that turn: '+e.message}}
function add(t,c){const x=document.createElement('div');x.className='bubble '+c;x.textContent=t;$('#messages').appendChild(x);x.scrollIntoView()}
function repos(){ $('#main').innerHTML=`<div class="top"><div><div class="eyebrow">Connected workspace</div><h1>Your repositories</h1><p class="sub">GitHub access is scoped to ${state.user.name}'s demo identity. Import a repository through Security chat to start a scan.</p></div><button class="primary" onclick="connectGithub()">Connect GitHub</button></div><div class="card"><div class="row"><h2>Repository access</h2><span class="pill">USER-SCOPED · ${state.user.id.slice(0,8)}</span></div><div class="repo"><span>⌘ Connect GitHub to load your repositories</span><button class="ghost" onclick="connectGithub()">Authorize</button></div><div class="repo"><span class="muted">After authorization, ask: “list my repositories”</span><button class="ghost" onclick="go('chat')">Open chat</button></div></div>`}
function report(){ $('#main').innerHTML=`<div class="top"><div><div class="eyebrow">AI-generated assessment</div><h1>Security report</h1><p class="sub">A concise view of what WebDoctor found and what to fix first.</p></div><button class="primary" onclick="go('chat')">Ask WebDoctor</button></div><div class="grid layout"><div class="card" style="text-align:center"><div class="eyebrow">SECURITY SCORE</div><div style="font-size:76px;font-weight:800;margin:18px;color:var(--green)">86</div><span class="muted">Improving · 14 points from excellent</span><div class="scan" style="text-align:left"><div class="step done">✓ Repository connected</div><div class="step done">✓ Application surface mapped</div><div class="step active">◉ Authorization paths correlated</div><div class="step">· Remediation verification pending</div></div></div><div class="card"><div class="eyebrow">TOP RISKS</div><div class="repo"><div><b class="danger">Broken authorization</b><br><small class="muted">Unauthenticated request reaches protected data</small></div><span class="pill">CRITICAL</span></div><div class="repo"><div><b style="color:var(--amber)">Exposed debug endpoint</b><br><small class="muted">Verbose errors reveal service metadata</small></div><span class="pill">HIGH</span></div><div class="repo"><div><b style="color:var(--blue)">Dependency drift</b><br><small class="muted">3 packages behind recommended versions</small></div><span class="pill">MEDIUM</span></div></div></div>`}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('wd_session');state.session=null;state.user=null;render()}boot();
</script></body></html>
